<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">

  <!-- Cliente -->
  <rect x="20" y="20" width="200" height="180" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <rect x="20" y="20" width="200" height="32" rx="6" fill="#534AB7"/>
  <rect x="20" y="44" width="200" height="8" fill="#534AB7"/>
  <text x="120" y="41" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Cliente</text>
  <line x1="20" y1="52" x2="220" y2="52" stroke="#534AB7" stroke-width="0.5"/>
  <text x="30" y="68" fill="#3C3489">id_cliente: int</text>
  <text x="30" y="84" fill="#3C3489">nombre: str</text>
  <text x="30" y="100" fill="#3C3489">correo: str</text>
  <text x="30" y="116" fill="#3C3489">contrasena_hash: str</text>
  <text x="30" y="132" fill="#3C3489">activo: bool</text>
  <text x="30" y="148" fill="#3C3489">intentos_fallidos: int</text>
  <line x1="20" y1="158" x2="220" y2="158" stroke="#534AB7" stroke-width="0.5"/>
  <text x="30" y="172" fill="#26215C">+ autenticar()</text>
  <text x="30" y="188" fill="#26215C">+ cerrar_sesion()</text>
  <text x="30" y="204" fill="#26215C">+ desactivar_cuenta()</text>

  <!-- Producto -->
  <rect x="460" y="20" width="200" height="180" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <rect x="460" y="20" width="200" height="32" rx="6" fill="#0F6E56"/>
  <rect x="460" y="44" width="200" height="8" fill="#0F6E56"/>
  <text x="560" y="41" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Producto</text>
  <line x1="460" y1="52" x2="660" y2="52" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="470" y="68" fill="#085041">id_producto: int</text>
  <text x="470" y="84" fill="#085041">nombre: str</text>
  <text x="470" y="100" fill="#085041">precio: float</text>
  <text x="470" y="116" fill="#085041">stock: int</text>
  <text x="470" y="132" fill="#085041">categoria: str</text>
  <text x="470" y="148" fill="#085041">activo: bool</text>
  <line x1="460" y1="158" x2="660" y2="158" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="470" y="172" fill="#04342C">+ hay_disponibilidad()</text>
  <text x="470" y="188" fill="#04342C">+ reducir_stock()</text>
  <text x="470" y="204" fill="#04342C">+ restaurar_stock()</text>

  <!-- Carrito -->
  <rect x="230" y="280" width="220" height="190" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <rect x="230" y="280" width="220" height="32" rx="6" fill="#854F0B"/>
  <rect x="230" y="304" width="220" height="8" fill="#854F0B"/>
  <text x="340" y="301" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Carrito</text>
  <line x1="230" y1="312" x2="450" y2="312" stroke="#854F0B" stroke-width="0.5"/>
  <text x="240" y="328" fill="#633806">id_carrito: int</text>
  <text x="240" y="344" fill="#633806">id_cliente: int (FK)</text>
  <text x="240" y="360" fill="#633806">total: float</text>
  <text x="240" y="376" fill="#633806">fecha_actualizacion: datetime</text>
  <line x1="230" y1="386" x2="450" y2="386" stroke="#854F0B" stroke-width="0.5"/>
  <text x="240" y="402" fill="#412402">+ agregar_item()</text>
  <text x="240" y="418" fill="#412402">+ eliminar_item()</text>
  <text x="240" y="434" fill="#412402">+ calcular_total()</text>
  <text x="240" y="450" fill="#412402">+ vaciar()</text>

  <!-- Pedido -->
  <rect x="20" y="560" width="220" height="240" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <rect x="20" y="560" width="220" height="32" rx="6" fill="#185FA5"/>
  <rect x="20" y="584" width="220" height="8" fill="#185FA5"/>
  <text x="130" y="581" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Pedido</text>
  <line x1="20" y1="592" x2="240" y2="592" stroke="#185FA5" stroke-width="0.5"/>
  <text x="30" y="608" fill="#0C447C">id_pedido: int</text>
  <text x="30" y="624" fill="#0C447C">id_cliente: int (FK)</text>
  <text x="30" y="640" fill="#0C447C">total: float</text>
  <text x="30" y="656" fill="#0C447C">direccion_entrega: str</text>
  <text x="30" y="672" fill="#0C447C">estado: str</text>
  <text x="30" y="688" fill="#0C447C">fecha: datetime</text>
  <line x1="20" y1="698" x2="240" y2="698" stroke="#185FA5" stroke-width="0.5"/>
  <text x="30" y="714" fill="#042C53">+ cambiar_estado()</text>
  <text x="30" y="730" fill="#042C53">+ cancelar()</text>
  <text x="30" y="746" fill="#042C53">+ generar_resumen()</text>
  <text x="30" y="762" fill="#042C53">ESTADOS: list</text>
  <text x="30" y="778" fill="#042C53">TRANSICIONES: dict</text>

  <!-- Pago -->
  <rect x="440" y="560" width="220" height="200" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <rect x="440" y="560" width="220" height="32" rx="6" fill="#993C1D"/>
  <rect x="440" y="584" width="220" height="8" fill="#993C1D"/>
  <text x="550" y="581" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Pago</text>
  <line x1="440" y1="592" x2="660" y2="592" stroke="#993C1D" stroke-width="0.5"/>
  <text x="450" y="608" fill="#712B13">id_pago: int</text>
  <text x="450" y="624" fill="#712B13">id_pedido: int (FK)</text>
  <text x="450" y="640" fill="#712B13">metodo: str</text>
  <text x="450" y="656" fill="#712B13">monto: float</text>
  <text x="450" y="672" fill="#712B13">aprobado: bool</text>
  <text x="450" y="688" fill="#712B13">referencia_transaccion: str</text>
  <line x1="440" y1="698" x2="660" y2="698" stroke="#993C1D" stroke-width="0.5"/>
  <text x="450" y="714" fill="#4A1B0C">+ procesar()</text>
  <text x="450" y="730" fill="#4A1B0C">+ generar_comprobante()</text>
  <text x="450" y="746" fill="#4A1B0C">METODOS: list</text>

  <!-- Relaciones -->
  <!-- Cliente -> Carrito -->
  <path d="M120 200 L120 260 L340 260 L340 280" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="124" y="252" fill="#888780" font-size="11">1</text>
  <text x="304" y="252" fill="#888780" font-size="11">1</text>

  <!-- Cliente -> Pedido -->
  <path d="M20 130 L0 130 L0 680 L20 680" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="2" y="320" fill="#888780" font-size="11">1</text>
  <text x="2" y="560" fill="#888780" font-size="11">*</text>

  <!-- Carrito -> Producto -->
  <path d="M450 340 L560 340 L560 200" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="454" y="332" fill="#888780" font-size="11">*</text>
  <text x="540" y="212" fill="#888780" font-size="11">*</text>

  <!-- Carrito -> Pedido -->
  <path d="M340 470 L340 530 L200 530 L200 560" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="344" y="490" fill="#888780" font-size="11">1</text>
  <text x="164" y="522" fill="#888780" font-size="11">*</text>

  <!-- Pedido -> Pago -->
  <path d="M240 670 L440 670" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="244" y="662" fill="#888780" font-size="11">1</text>
  <text x="416" y="662" fill="#888780" font-size="11">1</text>

  <!-- Pedido -> Producto (uso) -->
  <path d="M240 610 L380 610 L380 200 L460 200" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="244" y="602" fill="#888780" font-size="11">*</text>
  <text x="438" y="212" fill="#888780" font-size="11">*</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
</svg>
