<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">

  <!-- Sistema boundary -->
  <rect x="160" y="30" width="360" height="640" rx="10" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="340" y="54" text-anchor="middle" font-weight="bold" font-size="13" fill="#3d3d3a">Coquito Amarillo S.A.S.</text>

  <!-- CU-01 -->
  <ellipse cx="340" cy="95" rx="100" ry="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="95" text-anchor="middle" dominant-baseline="central" fill="#26215C">CU-01 Registrarse / Login</text>

  <!-- CU-02 -->
  <ellipse cx="340" cy="150" rx="100" ry="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="150" text-anchor="middle" dominant-baseline="central" fill="#26215C">CU-02 Ver catálogo</text>

  <!-- CU-03 -->
  <ellipse cx="340" cy="205" rx="100" ry="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="205" text-anchor="middle" dominant-baseline="central" fill="#26215C">CU-03 Gestionar carrito</text>

  <!-- CU-04 -->
  <ellipse cx="340" cy="260" rx="100" ry="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="260" text-anchor="middle" dominant-baseline="central" fill="#26215C">CU-04 Registrar pedido</text>

  <!-- CU-05 -->
  <ellipse cx="340" cy="315" rx="100" ry="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="315" text-anchor="middle" dominant-baseline="central" fill="#26215C">CU-05 Procesar pago</text>

  <!-- CU-06 -->
  <ellipse cx="340" cy="370" rx="100" ry="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="370" text-anchor="middle" dominant-baseline="central" fill="#26215C">CU-06 Cancelar pedido</text>

  <!-- CU-07 -->
  <ellipse cx="340" cy="425" rx="100" ry="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="425" text-anchor="middle" dominant-baseline="central" fill="#26215C">CU-07 Historial pedidos</text>

  <!-- CU-08 Admin -->
  <ellipse cx="340" cy="500" rx="110" ry="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="500" text-anchor="middle" dominant-baseline="central" fill="#04342C">CU-08 Gestionar inventario</text>

  <!-- CU-09 Admin -->
  <ellipse cx="340" cy="555" rx="110" ry="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="555" text-anchor="middle" dominant-baseline="central" fill="#04342C">CU-09 Gestionar pedidos</text>

  <!-- CU-10 Operador -->
  <ellipse cx="340" cy="630" rx="110" ry="20" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="630" text-anchor="middle" dominant-baseline="central" fill="#412402">CU-10 Estado logístico</text>

  <!-- Actor Cliente -->
  <circle cx="60" cy="260" r="18" fill="none" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="60" y1="278" x2="60" y2="318" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="34" y1="295" x2="86" y2="295" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="60" y1="318" x2="38" y2="348" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="60" y1="318" x2="82" y2="348" stroke="#3d3d3a" stroke-width="1.5"/>
  <text x="60" y="364" text-anchor="middle" fill="#3d3d3a" font-weight="bold">Cliente</text>

  <!-- Líneas Cliente -> CU-01 a CU-07 -->
  <line x1="78" y1="250" x2="240" y2="100" stroke="#888780" stroke-width="0.8"/>
  <line x1="78" y1="253" x2="240" y2="152" stroke="#888780" stroke-width="0.8"/>
  <line x1="78" y1="256" x2="240" y2="206" stroke="#888780" stroke-width="0.8"/>
  <line x1="78" y1="260" x2="240" y2="260" stroke="#888780" stroke-width="0.8"/>
  <line x1="78" y1="264" x2="240" y2="314" stroke="#888780" stroke-width="0.8"/>
  <line x1="78" y1="268" x2="240" y2="368" stroke="#888780" stroke-width="0.8"/>
  <line x1="78" y1="272" x2="240" y2="424" stroke="#888780" stroke-width="0.8"/>

  <!-- Actor Administrador -->
  <circle cx="620" cy="200" r="18" fill="none" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="620" y1="218" x2="620" y2="258" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="594" y1="235" x2="646" y2="235" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="620" y1="258" x2="598" y2="288" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="620" y1="258" x2="642" y2="288" stroke="#3d3d3a" stroke-width="1.5"/>
  <text x="620" y="304" text-anchor="middle" fill="#3d3d3a" font-weight="bold">Admin</text>

  <!-- Líneas Admin -> CU-08, CU-09 -->
  <line x1="602" y1="196" x2="450" y2="498" stroke="#888780" stroke-width="0.8"/>
  <line x1="602" y1="202" x2="450" y2="553" stroke="#888780" stroke-width="0.8"/>

  <!-- Actor Operador Logístico -->
  <circle cx="620" cy="500" r="18" fill="none" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="620" y1="518" x2="620" y2="558" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="594" y1="535" x2="646" y2="535" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="620" y1="558" x2="598" y2="588" stroke="#3d3d3a" stroke-width="1.5"/>
  <line x1="620" y1="558" x2="642" y2="588" stroke="#3d3d3a" stroke-width="1.5"/>
  <text x="620" y="604" text-anchor="middle" fill="#3d3d3a" font-weight="bold">Op. Logístico</text>

  <!-- Línea Operador -> CU-10 -->
  <line x1="602" y1="502" x2="450" y2="628" stroke="#888780" stroke-width="0.8"/>

  <!-- Leyenda -->
  <ellipse cx="200" cy="672" rx="14" ry="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="218" y="672" dominant-baseline="central" fill="#26215C" font-size="11">Cliente</text>
  <ellipse cx="290" cy="672" rx="14" ry="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="308" y="672" dominant-baseline="central" fill="#04342C" font-size="11">Administrador</text>
  <ellipse cx="410" cy="672" rx="14" ry="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="428" y="672" dominant-baseline="central" fill="#412402" font-size="11">Op. Logístico</text>

</svg>
